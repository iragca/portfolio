site_name: Chris Irag
copyright: Copyright &copy; 2025 Chris Irag
site_url: https://iragca.github.io/portfolio/
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Roboto
    code: Roboto Mon
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    # - content.action.edit
    # - content.action.view
    # - content.code.annotate
    # - content.code.copy
    # - content.code.select
    # - content.footnote.tooltips
    # - content.tabs.link
    # - content.tooltips
    # - header.autohide
    # - navigation.expand
    - navigation.footer
    - navigation.indexes
    # - navigation.instant
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    # - navigation.prune
    - navigation.sections
    - navigation.tabs
    # - navigation.tabs.sticky
    # - navigation.top
    # - navigation.tracking
    # - search.highlight
    # - search.share
    # - search.suggest
    # - toc.follow
    # - toc.integrate
  icon:
    tag:
      python: simple/python
      image-classification: material/image-check
      plant-pathology: fontawesome/solid/leaf
      coursework: material/school
      css: fontawesome/brands/css3
      javascript: fontawesome/brands/js
      html: fontawesome/brands/html5
      svelte: simple/svelte
      cloudflare: simple/cloudflare
      cloudflarepages: simple/cloudflarepages
      fastapi: simple/fastapi
      docker: fontawesome/brands/docker
      react: fontawesome/brands/react

extra:
  tags:
    Python: python
    "Image Classification": image-classification
    "Plant Pathology": plant-pathology
    "Coursework": coursework
    CSS: css
    JavaScript: javascript
    HTML: html
    Svelte: svelte
    Cloudflare: cloudflare
    "Cloudflare Pages": cloudflarepages
    "FastAPI": fastapi
    "Docker": docker
    "React": react
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/iragca
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/chris-andrei-irag/

watch:
  - docs/projects/
  - docs/index.md

plugins:
  - search
  - tags

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - neoteroi.timeline

nav:
  - Home: index.md
  - Projects:
      - projects/index.md
      - "Data Science":
          - "Capstone Project": projects/data-science/capstone.md
          - "MegaPlant": projects/data-science/megaplant.md
      - "Web Development":
          - "USTP-CDO Map": projects/web-dev/map.md
          - "Docuisine": projects/web-dev/docuisine.md
      - Tags: tags.md
  - History: history.md

extra_css:
  - assets/styles.css
  - assets/timeline.css